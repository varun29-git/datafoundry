name: tests

on:
  push:
  pull_request:

jobs:
  tok65k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tok65k/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e './tok65k[dev]'
      - name: Run unit tests
        run: python -m unittest discover -s tok65k/tests -v
      - name: Lint Python sources
        run: ruff check --config tok65k/pyproject.toml tok65k internal/build-65k.py
