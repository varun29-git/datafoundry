[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tok65k"
version = "1.0.0"
description = "Load the stock 65,536-token tokenizer from docs/hf-tokenizer."
requires-python = ">=3.11"
dependencies = [
    "tokenizers==0.23.2",
    "transformers==5.18.0",
]

[project.scripts]
tok65k = "tok65k.cli:main"

[tool.setuptools]
packages = ["tok65k"]
